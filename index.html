<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayın Seyit Ahmet Göktaş</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #1f1510;
      --bg-mid: #37261d;
      --bg-light: #4d3528;
      --env-cream: #f4ead5;
      --env-warm: #e6d6b8;
      --paper-light: #fdfaf3;
      --paper-warm: #f2e9d6;
      --ink-primary: #231a14;
      --ink-deep: #120d0a;
      --wax-red: #922a25;
      --wax-dark: #4e100e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      font-family: "Lora", Georgia, serif;
      color: var(--ink-primary);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,226,182,.14), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(12,7,4,.65), transparent 70%),
        linear-gradient(155deg, var(--bg-light), var(--bg-mid) 52%, var(--bg-dark));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image:
        radial-gradient(rgba(255,244,224,.09) 1px, transparent 0),
        radial-gradient(rgba(0,0,0,.16) 1px, transparent 0);
      background-size: 26px 26px;
      background-position: 0 0, 13px 13px;
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      gap: 22px;
    }

    .hint {
      text-align: center;
      color: rgba(252,241,222,.9);
      font-size: clamp(.88rem, 2.2vw, 1rem);
      user-select: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.45);
      transition: opacity .4s ease, transform .4s ease;
    }

    .hint.is-hidden {
      opacity: 0;
      transform: translateY(-7px);
      pointer-events: none;
    }

    .hint-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 17px;
      border-radius: 999px;
      background: rgba(255,247,232,.11);
      border: 1px solid rgba(255,238,208,.22);
      backdrop-filter: blur(7px);
    }

    .hint-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f2c57c;
      box-shadow: 0 0 10px rgba(242,197,124,.85);
      animation: pulse 2.1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .85; }
      50% { transform: scale(1.35); opacity: 1; }
    }

    .mail-workspace {
      position: relative;
      width: min(92vw, 520px);
      height: clamp(275px, 48vw, 340px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: height .9s cubic-bezier(.22,1,.36,1);
      isolation: isolate;
    }

    .mail-workspace.is-open {
      height: clamp(640px, 112vw, 760px);
    }

    .desk-shadow {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(10,6,3,.68), rgba(10,6,3,.22) 58%, transparent 80%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
      transition: transform .8s ease, opacity .6s ease;
    }

    .mail-workspace.is-open .desk-shadow {
      transform: translateX(-50%) scale(1.04);
      opacity: .8;
    }

    .envelope {
      position: relative;
      width: 100%;
      height: clamp(235px, 41vw, 305px);
      cursor: pointer;
      outline: none;
      transform: translateY(0);
      transition: transform .85s cubic-bezier(.22,1,.36,1);
      transform-style: preserve-3d;
    }

    .envelope:focus-visible {
      border-radius: 10px;
      box-shadow: 0 0 0 3px rgba(245,206,145,.8);
    }

    .mail-workspace:not(.is-open) .envelope:hover {
      transform: translateY(-4px);
    }

    .mail-workspace.is-open .envelope {
      cursor: default;
      transform: translateY(10px);
    }

    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background:
        repeating-linear-gradient(0deg, rgba(120,90,54,.025) 0 2px, transparent 2px 5px),
        linear-gradient(180deg, #d7c19b, #c6ae84);
      border: 1px solid rgba(116,87,52,.36);
      box-shadow:
        inset 0 10px 20px rgba(42,26,10,.25),
        0 16px 32px rgba(10,6,3,.52);
      z-index: 1;
    }

    /* MEKTUP */

    .letter-paper {
      position: absolute;
      left: 50%;
      bottom: 14px;
      width: min(94%, 486px);
      max-height: min(620px, 88vh);
      overflow: auto;
      transform: translateX(-50%) translateY(0) scale(.94);
      transform-origin: bottom center;
      background:
        repeating-linear-gradient(180deg, rgba(145,120,88,.028) 0 1px, transparent 1px 26px),
        radial-gradient(circle at 50% 45%, var(--paper-light) 68%, var(--paper-warm));
      border-radius: 6px;
      padding: clamp(24px, 4.8vw, 36px) clamp(22px, 5vw, 38px);
      border: 1px solid rgba(176,154,118,.48);
      box-shadow:
        0 8px 18px rgba(24,15,8,.2),
        inset 0 0 24px rgba(186,165,130,.16);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition:
        transform 1.05s cubic-bezier(.22,1,.36,1),
        box-shadow 1.05s cubic-bezier(.22,1,.36,1),
        opacity .5s ease;
      scrollbar-width: thin;
    }

    .mail-workspace.is-open .letter-paper {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(calc(-1 * clamp(225px, 36vw, 270px))) scale(1);
      box-shadow:
        0 24px 48px rgba(12,7,4,.38),
        0 6px 16px rgba(12,7,4,.22),
        inset 0 0 28px rgba(186,165,130,.2);
      transition:
        transform 1.15s cubic-bezier(.16,1,.3,1) .18s,
        box-shadow 1.15s cubic-bezier(.16,1,.3,1) .18s,
        opacity .5s ease .12s;
    }

    .letter-salutation {
      font-family: "Caveat", cursive;
      font-size: clamp(2.05rem, 5.2vw, 2.7rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--ink-deep);
      margin-bottom: clamp(12px, 2.6vw, 18px);
      letter-spacing: .015em;
      transform: rotate(-.4deg);
      text-shadow: 0 .5px 0 rgba(18,13,10,.45);
      -webkit-font-smoothing: antialiased;
    }

    .letter-content {
      font-family: "Lora", Georgia, serif;
      font-size: clamp(.96rem, 2.2vw, 1.09rem);
      line-height: 1.72;
      color: var(--ink-primary);
      overflow-wrap: break-word;
    }

    .letter-content p + p {
      margin-top: clamp(12px, 2.5vw, 16px);
    }

    .letter-closing {
      font-style: italic;
      font-weight: 500;
      color: #2c2019;
      padding-bottom: 5px;
    }

    /* ZARF KAPAĞI */

    .env-flap-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 56%;
      perspective: 1400px;
      z-index: 5;
      pointer-events: none;
      transition: z-index 0s linear .42s;
    }

    .mail-workspace.is-open .env-flap-wrapper {
      z-index: 1;
      transition: z-index 0s linear .32s;
    }

    .env-flap {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: top center;
      transform-style: preserve-3d;
      transition: transform .85s cubic-bezier(.22,1,.36,1);
    }

    .mail-workspace.is-open .env-flap {
      transform: rotateX(180deg);
    }

    .flap-front-face,
    .flap-back-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      clip-path: polygon(0 0, 100% 0, 50% 96%);
    }

    .flap-front-face {
      background: linear-gradient(180deg, #e7d6b7, #f5ebd5 68%, #ebd9b8);
      filter: drop-shadow(0 5px 7px rgba(42,26,10,.22));
    }

    .flap-back-face {
      transform: rotateX(180deg);
      background: linear-gradient(180deg, #c9b289, #decba8);
      box-shadow: inset 0 -4px 10px rgba(42,26,10,.24);
    }

    /* ZARF ÖN CEPLERİ */

    .env-pocket {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      overflow: hidden;
      z-index: 4;
      pointer-events: none;
    }

    .pocket-left,
    .pocket-right,
    .pocket-bottom {
      position: absolute;
      inset: 0;
    }

    .pocket-left {
      background: linear-gradient(125deg, #f5ebd6, var(--env-warm));
      clip-path: polygon(0 0, 54% 52%, 0 100%);
    }

    .pocket-right {
      background: linear-gradient(235deg, #f1e6cf, #e1d0b0);
      clip-path: polygon(100% 0, 46% 52%, 100% 100%);
    }

    .pocket-bottom {
      background:
        repeating-linear-gradient(90deg, rgba(120,92,58,.02) 0 3px, transparent 3px 7px),
        linear-gradient(180deg, #f7ede0, var(--env-cream) 55%, var(--env-warm));
      clip-path: polygon(0 100%, 50% 45%, 100% 100%);
      border-bottom: 1px solid rgba(130,100,62,.3);
    }

    .pocket-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* PUL */

    .stamp {
      position: absolute;
      top: clamp(14px, 3vw, 20px);
      right: clamp(14px, 3vw, 22px);
      width: clamp(38px, 7vw, 48px);
      height: clamp(46px, 8.5vw, 58px);
      border: 1.5px dashed rgba(138,98,56,.45);
      background: rgba(255,250,240,.56);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(4deg);
      z-index: 6;
      pointer-events: none;
    }

    .stamp-frame {
      width: 82%;
      height: 82%;
      border: 1px solid rgba(138,98,56,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      letter-spacing: .08em;
      color: rgba(118,82,44,.72);
    }

    /* ZARF ÜZERİNDEKİ İSİM */

    .env-recipient {
      position: absolute;
      left: 50%;
      bottom: clamp(20px, 5vw, 34px);
      transform: translateX(-50%);
      width: 86%;
      text-align: center;
      z-index: 6;
      pointer-events: none;
      transition: opacity .4s ease, transform .5s ease;
    }

    .mail-workspace.is-open .env-recipient {
      opacity: .12;
      transform: translateX(-50%) translateY(8px);
    }

    .env-recipient-text {
      font-family: "Dancing Script", cursive;
      font-weight: 700;
      font-size: clamp(1.7rem, 4.8vw, 2.45rem);
      line-height: 1.2;
      color: #291d16;
      letter-spacing: .01em;
      display: inline-block;
      padding: 3px 14px;
      border-radius: 6px;
      background: rgba(253,247,235,.58);
      text-shadow: 0 1px 0 rgba(255,252,245,.75);
    }

    /* GERÇEKÇİ BALMUMU MÜHÜR */

    .wax-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: clamp(58px, 10vw, 66px);
      height: clamp(58px, 10vw, 66px);
      border-radius: 48% 52% 51% 49% / 51% 48% 52% 49%;

      background:
        radial-gradient(
          ellipse at 34% 23%,
          rgba(255,190,174,.55) 0%,
          transparent 25%
        ),
        radial-gradient(
          circle at 38% 30%,
          #b83b34 0%,
          #982a25 48%,
          #741b18 78%,
          #51110f 100%
        );

      border: 1px solid rgba(75,13,11,.7);

      box-shadow:
        0 7px 13px rgba(25,8,5,.48),
        0 2px 3px rgba(255,224,202,.22),
        inset 0 2px 4px rgba(255,210,196,.42),
        inset 0 -5px 8px rgba(39,4,3,.58);

      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
      pointer-events: none;

      transition:
        opacity .35s ease,
        transform .55s cubic-bezier(.22,1,.36,1);
    }

    /* Mührün kabartmalı iç halkası */

    .wax-seal::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255,211,194,.48);

      box-shadow:
        inset 0 1px 2px rgba(255,220,205,.18),
        0 1px 2px rgba(45,5,4,.35);
    }

    /* Balmumunun ışık yansıması */

    .wax-seal::after {
      content: "";
      position: absolute;
      width: 42%;
      height: 17%;
      top: 12%;
      left: 18%;
      border-radius: 50%;
      transform: rotate(-28deg);
      background: rgba(255,211,194,.13);
      filter: blur(2px);
    }

    /* Mühür harflerinin kabartma görünümü */

    .wax-seal span {
      position: relative;
      z-index: 1;
      font-family: "Lora", Georgia, serif;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .045em;
      font-style: italic;
      color: rgba(255,226,215,.96);
      transform: translateY(-1px);

      text-shadow:
        0 1px 0 rgba(255,190,174,.35),
        0 -1px 0 rgba(55,5,4,.7),
        1px 1px 2px rgba(35,4,3,.8);
    }

    .mail-workspace.is-open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.72);
    }

    /* KONTROLLER */

    .controls {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .toggle-close-btn {
      appearance: none;
      border: 1px solid rgba(252,238,212,.35);
      background: rgba(252,244,228,.15);
      color: #fdf5e6;
      font: .92rem "Lora", Georgia, serif;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,.32);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease, background-color .2s ease;
    }

    .toggle-close-btn:hover {
      background: rgba(252,244,228,.25);
    }

    .toggle-close-btn:focus-visible {
      outline: 2px solid #f5ce91;
      outline-offset: 2px;
    }

    .mail-workspace.is-open ~ .controls .toggle-close-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 420px) {
      .stage {
        gap: 18px;
      }

      .letter-paper {
        padding: 20px 18px 28px;
      }

      .letter-content {
        line-height: 1.68;
      }

      .mail-workspace.is-open {
        height: 700px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="stage">

    <div id="hintBanner" class="hint" aria-live="polite">
      <span class="hint-badge">
        <span class="hint-pulse" aria-hidden="true"></span>
        <span>Açmak için zarfa dokunun</span>
      </span>
    </div>

    <section
      id="mailWorkspace"
      class="mail-workspace"
      aria-label="Sayın Seyit Ahmet Göktaş için mektup zarfı"
    >

      <div class="desk-shadow" aria-hidden="true"></div>

      <div
        id="envelopeTrigger"
        class="envelope"
        role="button"
        tabindex="0"
        aria-expanded="false"
        aria-label="Sayın Seyit Ahmet Göktaş yazılı zarfı aç"
      >

        <div class="env-back" aria-hidden="true"></div>

        <!-- MEKTUP KAĞIDI -->

        <article id="letterPaper" class="letter-paper" aria-label="Mektup içeriği">

          <div class="letter-salutation">
            Sayın Seyit Ahmet Göktaş,
          </div>

          <div class="letter-content">

            <p>
              Emekleriniz, sabrınız ve bize her zaman yol gösterdiğiniz için sonsuz teşekkürler. Öğretmenimiz olmanız, sizden ders almak bizim için büyük bir şans.
            </p>

            <p class="letter-closing">
              Her şey için teşekkürler!
            </p>

          </div>

        </article>

        <!-- ZARF ÖN CEPLERİ -->

        <div class="env-pocket" aria-hidden="true">

          <div class="pocket-left"></div>
          <div class="pocket-right"></div>
          <div class="pocket-bottom"></div>

          <svg
            class="pocket-lines"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
          >
            <line x1="0" y1="0" x2="50" y2="52"
              stroke="rgba(115,86,50,.22)" stroke-width=".45"/>

            <line x1="100" y1="0" x2="50" y2="52"
              stroke="rgba(115,86,50,.22)" stroke-width=".45"/>

            <line x1="0" y1="100" x2="50" y2="45"
              stroke="rgba(255,250,240,.55)" stroke-width=".4"/>

            <line x1="100" y1="100" x2="50" y2="45"
              stroke="rgba(255,250,240,.55)" stroke-width=".4"/>
          </svg>

        </div>

        <!-- ÖZEL PUL -->

        <div class="stamp" aria-hidden="true">
          <div class="stamp-frame">ÖZEL</div>
        </div>

        <!-- ALICI -->

        <div class="env-recipient">
          <span class="env-recipient-text">Sayın Seyit Ahmet Göktaş</span>
        </div>

        <!-- AÇILAN KAPAK -->

        <div class="env-flap-wrapper" aria-hidden="true">

          <div class="env-flap">
            <div class="flap-front-face"></div>
            <div class="flap-back-face"></div>
          </div>

        </div>

        <!-- BALMUMU MÜHÜR -->

        <div class="wax-seal" aria-hidden="true">
          <span></span>
        </div>

      </div>

    </section>

    <div class="controls">
      <button id="closeBtn" type="button" class="toggle-close-btn">
        Zarfı Kapat
      </button>
    </div>

  </main>

  <script>
    (() => {

      const workspace = document.getElementById("mailWorkspace");
      const trigger = document.getElementById("envelopeTrigger");
      const closeBtn = document.getElementById("closeBtn");
      const hintBanner = document.getElementById("hintBanner");

      /*
        İSİMDEN OTOMATİK MÜHÜR OLUŞTURMA

        Seyit Ahmet Göktaş = SAG
        Hilal Kılıç = HK

        Türkçe karakterler de desteklenir.
      */

      const recipientName = document
        .querySelector(".env-recipient-text")
        .textContent
        .replace(/^Sayın\s+/i, "")
        .trim();

      const initials = recipientName
        .split(/\s+/)
        .filter(Boolean)
        .map(word => Array.from(word)[0])
        .join("")
        .toLocaleUpperCase("tr-TR");

      const sealText = document.querySelector(".wax-seal span");

      sealText.textContent = initials;

      sealText.style.fontSize =
        initials.length > 2 ? ".72rem" : ".95rem";

      let opened = false;

      function setOpenState(nextOpen) {

        opened = Boolean(nextOpen);

        workspace.classList.toggle("is-open", opened);

        trigger.setAttribute(
          "aria-expanded",
          String(opened)
        );

        hintBanner.classList.toggle(
          "is-hidden",
          opened
        );

        trigger.setAttribute(
          "aria-label",
          opened
            ? `Sayın ${recipientName} için mektup açık`
            : `Sayın ${recipientName} yazılı zarfı aç`
        );

      }

      // Fare veya dokunmatik ekran ile açma

      trigger.addEventListener("click", (event) => {

        if (event.target.closest("#letterPaper")) {
          return;
        }

        if (!opened) {
          setOpenState(true);
        }

      });

      // Klavye desteği

      trigger.addEventListener("keydown", (event) => {

        if (event.key === "Enter" || event.key === " ") {

          event.preventDefault();

          if (!opened) {
            setOpenState(true);
          }

        }

      });

      // Zarfı kapatma

      closeBtn.addEventListener("click", () => {

        setOpenState(false);

        trigger.focus();

      });

    })();
  </script>

</body>
</html>
